<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slop Spotter for X</title>
    <link rel="stylesheet" href="../src/panel.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="top">
        <img src="../icons/icon-32.png" width="18" height="18" alt="">
        <h1>Slop Spotter</h1>
        <label class="switch" title="Check posts on X">
          <input id="enabled" type="checkbox" role="switch" aria-label="Check posts on X">
          <span class="track"></span>
        </label>
      </header>

      <section id="summary" class="summary" aria-live="polite" hidden>
        <p class="figure"><span id="figure"></span><span id="figureUnit" class="unit"></span></p>
        <p id="summaryLine" class="summary-line"></p>
      </section>

      <section id="setup" class="setup" hidden>
        <p class="setup-title">Connect Jev to start</p>
        <p class="setup-copy">Paste your API key. Posts on X are checked as you read.</p>
        <form id="keyForm" class="key-form">
          <input id="jevApiKey" class="text-input" type="password" autocomplete="off" placeholder="API key" aria-label="Jev API key">
          <button class="button primary" type="submit">Save</button>
        </form>
        <p class="setup-foot">
          <a href="https://console.typesafe.ai/keys" target="_blank" rel="noopener">Get a key ↗</a>
          <span id="keyStatus" class="status" role="status"></span>
        </p>
      </section>

      <div id="panel" class="panel" hidden></div>

      <p id="diagnostics" class="warning" hidden></p>

      <footer>
        <button id="options" class="button link" type="button">Privacy &amp; data</button>
        <span id="status" class="status" role="status">TypeSafe Jev</span>
      </footer>
    </main>

    <script src="../src/storage.js"></script>
    <script src="../src/key-store.js"></script>
    <script src="../src/panel.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
